<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Corner — Fluxograma do aplicativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  @page { size: 297mm 210mm; margin: 0; }
  :root {
    --bg: #0e0f17; --surface: #16182a; --surface2: #1e2030; --line: #2c2e3d; --line2: #3f4150;
    --text: #e9e9ed; --muted: #a3a5b5; --dim: #7a7c8c;
    --red: oklch(0.63 0.21 25); --red2: oklch(0.66 0.21 25); --blue: oklch(0.62 0.17 258);
    --green: #75d69a; --amber: oklch(0.8 0.14 85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pg { position: relative; width: 297mm; height: 210mm; overflow: hidden; break-after: page; background: var(--bg); }
  .pg:last-child { break-after: auto; }
  .pg::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 8% 0%, oklch(0.62 0.17 258 / 0.13), transparent 70%), radial-gradient(50% 45% at 96% 100%, oklch(0.63 0.21 25 / 0.12), transparent 70%); }

  /* ── Logo ── */
  .logo { position: relative; flex: none; overflow: hidden; background: linear-gradient(160deg, #232532, #161826); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.07), 0 10px 30px rgba(0,0,0,.45); }
  .logo-in { position: absolute; left: 0; top: 0; width: 148px; height: 148px; transform-origin: 0 0; }
  .logo-in svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo-in i { position: absolute; left: 67px; top: 65px; font-size: 64px; color: var(--red); transform: rotate(-35deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }

  /* ── Capa ── */
  .capa .cordas { position: absolute; right: -10px; bottom: -10px; width: 640px; height: 640px; opacity: .5; }
  .capa .luva { position: absolute; right: 120px; top: 70px; font-size: 330px; color: var(--red); opacity: .07; transform: rotate(-35deg); }
  .capa .conteudo { position: absolute; left: 90px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .capa h1 { margin-top: 34px; font-size: 118px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; background: linear-gradient(100deg, #f4f2f2 25%, oklch(0.82 0.1 25) 60%, oklch(0.8 0.1 258)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .capa .tipo { margin-top: 22px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .capa .tag { margin-top: 12px; max-width: 520px; font-size: 17px; line-height: 1.5; color: var(--muted); }
  .capa .corners { display: flex; gap: 22px; margin-top: 34px; font-size: 13px; color: var(--muted); }
  .capa .corners span { display: inline-flex; align-items: center; gap: 8px; }
  .capa .corners i { width: 12px; height: 12px; border-radius: 4px; display: block; }
  .capa .rodape { position: absolute; left: 90px; bottom: 44px; right: 90px; display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); }

  /* ── Cabeçalho e rodapé das páginas ── */
  .cab { position: absolute; left: 40px; right: 40px; top: 24px; display: flex; align-items: center; gap: 14px; }
  .cab h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .cab p { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .cab .sec { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .filete { position: absolute; left: 40px; right: 40px; top: 84px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--red), var(--blue)); opacity: .75; }
  .rod { position: absolute; left: 40px; right: 40px; bottom: 18px; display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); }

  /* ── Nós do fluxograma ── */
  .no { position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 10px; font-size: 12px; line-height: 1.32; color: var(--text); }
  .tx { width: 100%; }
  .no small { display: block; margin-top: 2px; font-size: 10.3px; line-height: 1.3; color: var(--muted); font-weight: 400; }
  .no b { font-weight: 700; }
  .no i.ic { margin-right: 6px; font-size: 15px; vertical-align: -2px; }
  .ini { border-radius: 999px; font-weight: 700; color: #fff; background: linear-gradient(145deg, oklch(0.66 0.21 25), oklch(0.55 0.21 25)); box-shadow: 0 8px 20px -8px oklch(0.63 0.21 25 / .7); }
  .ini small { color: #ffe0dc; }
  .fim { border-radius: 999px; font-weight: 700; color: #c6f3d9; background: rgba(117, 214, 154, .12); border: 1.5px solid var(--green); }
  .proc { border-radius: 12px; background: var(--surface); border: 1px solid var(--line2); }
  .tela { border-radius: 14px; background: var(--surface); border: 1px solid var(--line2); border-top: 3px solid var(--red); }
  .acao { border-radius: 16px; font-weight: 700; color: #fff; background: linear-gradient(145deg, oklch(0.66 0.21 25), oklch(0.55 0.21 25)); box-shadow: 0 10px 22px -10px oklch(0.63 0.21 25 / .8); }
  .sis { border-radius: 12px; background: oklch(0.62 0.17 258 / .14); border: 1px solid oklch(0.62 0.17 258 / .6); }
  .round { border-radius: 14px; background: oklch(0.63 0.21 25 / .16); border: 1.5px solid var(--red); }
  .descanso { border-radius: 14px; background: oklch(0.62 0.17 258 / .18); border: 1.5px solid var(--blue); }
  .crit { border-radius: 12px; background: oklch(0.63 0.21 25 / .14); border: 1px solid oklch(0.63 0.21 25 / .7); }
  .dado { border-radius: 10px / 14px; background: var(--surface2); border: 1.5px dashed var(--dim); }
  .plan { border-radius: 12px; background: transparent; border: 1.5px dashed var(--line2); color: var(--muted); }
  .dec { padding: 0 26px; }
  .dec svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }
  .dec span { position: relative; font-weight: 600; font-size: 11.6px; }
  .dec span small { font-weight: 400; }
  .lista { flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line2); }
  .lista h4 { font-size: 12.5px; font-weight: 700; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .lista ul { list-style: none; display: grid; gap: 5px; width: 100%; }
  .lista li { position: relative; padding-left: 13px; font-size: 11.2px; line-height: 1.35; color: #d3d4dc; }
  .lista li::before { content: ""; position: absolute; left: 0; top: 5.5px; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); }
  .lista li small { display: inline; color: var(--muted); font-size: 10.5px; }
  .lista.l-red { border-left: 4px solid var(--red); } .lista.l-red li::before { background: var(--red); }
  .lista.l-amber { border-left: 4px solid var(--amber); } .lista.l-amber li::before { background: var(--amber); }
  .lista.l-blue { border-left: 4px solid var(--blue); } .lista.l-blue li::before { background: var(--blue); }
  .lista.l-top { border-top: 3px solid var(--red); }
  .nota { padding: 0; font-size: 11px; font-style: italic; color: var(--muted); justify-content: flex-start; text-align: left; }
  .rot { position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: 1px 7px; border-radius: 99px; font-size: 10px; font-weight: 700; background: var(--bg); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .rot.sim { color: var(--green); border-color: rgba(117,214,154,.5); } .rot.nao { color: oklch(0.78 0.13 25); border-color: oklch(0.63 0.21 25 / .55); }
  svg.cx { position: absolute; inset: 0; width: 1122px; height: 794px; z-index: 1; overflow: visible; }

  /* ── Legenda ── */
  .leg { position: absolute; left: 58px; right: 58px; display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; font-size: 11px; color: var(--muted); z-index: 2; }
  .leg > div { display: flex; align-items: center; gap: 8px; }
  .leg .m { width: 34px; height: 20px; flex: none; position: relative; }
  .leg .m.pill { border-radius: 99px; background: linear-gradient(145deg, oklch(0.66 0.21 25), oklch(0.55 0.21 25)); }
  .leg .m.fimm { border-radius: 99px; background: rgba(117,214,154,.12); border: 1.5px solid var(--green); }
  .leg .m.tl { border-radius: 6px; background: var(--surface); border: 1px solid var(--line2); border-top: 3px solid var(--red); }
  .leg .m.sy { border-radius: 6px; background: oklch(0.62 0.17 258 / .14); border: 1px solid oklch(0.62 0.17 258 / .6); }
  .leg .m.dd { border-radius: 4px / 7px; background: var(--surface2); border: 1.5px dashed var(--dim); }
  .leg .m.pl { border-radius: 6px; border: 1.5px dashed var(--line2); }
  .leg .m.rr { border-radius: 6px; background: oklch(0.63 0.21 25 / .16); border: 1.5px solid var(--red); }
  .leg .m.db { border-radius: 6px; background: oklch(0.62 0.17 258 / .18); border: 1.5px solid var(--blue); }
  .leg .m.di svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="doc"></div>

<!-- Pontas de seta (compartilhadas entre as páginas) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="seta-g" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9cac"/></marker>
    <marker id="seta-r" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="oklch(0.7 0.2 25)"/></marker>
    <marker id="seta-b" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="oklch(0.72 0.15 258)"/></marker>
  </defs>
</svg>

<script>
const TOTAL = 8
const doc = document.getElementById('doc')
const hoje = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })

const logo = s => `<div class="logo" style="width:${s}px;height:${s}px;border-radius:${s * 0.243}px"><div class="logo-in" style="transform:scale(${s / 148})">
  <svg viewBox="0 0 120 120"><path d="M120 24 H24 V120" fill="none" stroke="oklch(0.63 0.21 25)" stroke-width="5" stroke-linecap="round"/><path d="M120 36 H36 V120" fill="none" stroke="#e9e9ed" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/><path d="M120 48 H48 V120" fill="none" stroke="oklch(0.62 0.17 258)" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="24" r="11" fill="oklch(0.63 0.21 25)"/><circle cx="24" cy="24" r="4" fill="#161826"/></svg>
  <i class="ph-fill ph-boxing-glove"></i></div></div>`

// ── Capa ──────────────────────────────────────────────────────
doc.insertAdjacentHTML('beforeend', `
<section class="pg capa">
  <svg class="cordas" viewBox="0 0 400 400"><g fill="none" stroke-width="3" stroke-linecap="round"><path d="M400 120 H120 V400" stroke="oklch(0.63 0.21 25)"/><path d="M400 160 H160 V400" stroke="#e9e9ed"/><path d="M400 200 H200 V400" stroke="oklch(0.62 0.17 258)"/></g></svg>
  <div class="conteudo">
    ${logo(150)}
    <h1>Corner</h1>
    <div class="tipo">Fluxograma do aplicativo</div>
    <p class="tag">Seu treino de boxe, planejado entre um round e outro. Como cada tela, regra e decisão do app funciona, do login ao registro do treino.</p>
    <div class="corners"><span><i style="background:var(--red)"></i>Corner vermelho · ações e rounds</span><span><i style="background:var(--blue)"></i>Corner azul · decisões e descanso</span></div>
  </div>
  <div class="rodape"><span>Versão do documento · ${hoje} · ${TOTAL} páginas</span></div>
</section>`)

// ── Motor de fluxogramas ──────────────────────────────────────
function pagina(n, secao, titulo, sub) {
  const el = document.createElement('section'); el.className = 'pg'
  el.innerHTML = `<div class="cab">${logo(38)}<div><h2>${titulo}</h2><p>${sub}</p></div><div class="sec">${secao}</div></div><div class="filete"></div>
    <svg class="cx"></svg><div class="rod"><span>Corner · Fluxograma do aplicativo</span><span>${n} / ${TOTAL}</span></div>`
  doc.appendChild(el)
  const svg = el.querySelector('svg.cx'), nos = {}, ligs = []

  const no = (id, tipo, x, y, w, h, html) => {
    const d = document.createElement('div'); d.className = `no ${tipo}`
    d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`
    if (tipo === 'dec') {
      d.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="${w / 2},1.5 ${w - 1.5},${h / 2} ${w / 2},${h - 1.5} 1.5,${h / 2}" fill="oklch(0.62 0.17 258 / .15)" stroke="oklch(0.62 0.17 258)" stroke-width="1.6"/></svg><span>${html}</span>`
    } else if (tipo.startsWith('lista') || tipo === 'nota') d.innerHTML = html
    else d.innerHTML = `<div class="tx">${html}</div>` // um único filho: o texto e o <small> empilham, em vez de ficar lado a lado
    el.appendChild(d); nos[id] = { x, y, w, h }
    return d
  }
  const lista = (id, x, y, w, h, titulo, itens, cor = '') => no(id, `lista ${cor}`, x, y, w, h, `<h4>${titulo}</h4><ul>${itens.map(i => `<li>${i}</li>`).join('')}</ul>`)
  const liga = (a, b, o = {}) => ligs.push({ a, b, ...o })
  const ancora = (n, lado) => ({ l: [n.x, n.y + n.h / 2], r: [n.x + n.w, n.y + n.h / 2], t: [n.x + n.w / 2, n.y], b: [n.x + n.w / 2, n.y + n.h] }[lado])

  const rota = (l) => {
    const A = nos[l.a], B = nos[l.b], de = l.de ?? 'r', para = l.para ?? 'l'
    const s = ancora(A, de), e = ancora(B, para)
    if (l.via) return [s, ...l.via, e]
    const hS = de === 'l' || de === 'r', hE = para === 'l' || para === 'r'
    if (hS && hE) { if (s[1] === e[1]) return [s, e]; const mx = l.mid ?? (s[0] + e[0]) / 2; return [s, [mx, s[1]], [mx, e[1]], e] }
    if (!hS && !hE) { if (s[0] === e[0]) return [s, e]; const my = l.mid ?? (s[1] + e[1]) / 2; return [s, [s[0], my], [e[0], my], e] }
    if (hS && !hE) return [s, [e[0], s[1]], e]
    return [s, [s[0], e[1]], e]
  }
  const arredondar = (p, r = 10) => {
    const pts = p.filter((q, i) => i === 0 || q[0] !== p[i - 1][0] || q[1] !== p[i - 1][1])
    let d = `M${pts[0][0]} ${pts[0][1]}`
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1]
      const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, l1 / 2, l2 / 2)
      d += ` L${x1 - (x1 - x0) / l1 * rr} ${y1 - (y1 - y0) / l1 * rr} Q${x1} ${y1} ${x1 + (x2 - x1) / l2 * rr} ${y1 + (y2 - y1) / l2 * rr}`
    }
    const u = pts[pts.length - 1]; return d + ` L${u[0]} ${u[1]}`
  }
  const desenhar = () => {
    for (const l of ligs) {
      const pts = rota(l), cor = l.cor ?? 'g'
      const stroke = { g: '#9a9cac', r: 'oklch(0.7 0.2 25)', b: 'oklch(0.72 0.15 258)' }[cor]
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      p.setAttribute('d', arredondar(pts)); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', '1.7')
      if (l.tracejado) p.setAttribute('stroke-dasharray', '5 4')
      if (!l.sem) p.setAttribute('marker-end', `url(#seta-${cor})`)
      svg.appendChild(p)
      if (l.rot) {
        const [x0, y0] = pts[0], [x1, y1] = pts[1], len = Math.hypot(x1 - x0, y1 - y0) || 1
        const pos = l.rotPos ?? [x0 + (x1 - x0) / len * Math.min(24, len / 2), y0 + (y1 - y0) / len * Math.min(24, len / 2)]
        const t = document.createElement('div'); t.className = `rot ${/^sim/i.test(l.rot) ? 'sim' : /^n[ãa]o/i.test(l.rot) ? 'nao' : ''}`
        t.style.left = pos[0] + 'px'; t.style.top = pos[1] + 'px'; t.textContent = l.rot; el.appendChild(t)
      }
    }
  }
  return { el, no, lista, liga, desenhar, legenda: y => legenda(el, y) }
}

function legenda(el, y) {
  el.insertAdjacentHTML('beforeend', `<div class="leg" style="top:${y}px">
    <div><span class="m pill"></span>Início / ação principal</div>
    <div><span class="m tl"></span>Tela do app</div>
    <div><span class="m sy"></span>Ação do sistema</div>
    <div><span class="m di"><svg viewBox="0 0 34 20"><polygon points="17,1 33,10 17,19 1,10" fill="oklch(0.62 0.17 258 / .15)" stroke="oklch(0.62 0.17 258)" stroke-width="1.5"/></svg></span>Decisão</div>
    <div><span class="m dd"></span>Dados no aparelho</div>
    <div><span class="m rr"></span>Round</div>
    <div><span class="m db"></span>Descanso</div>
    <div><span class="m fimm"></span>Fim do fluxo</div>
    <div><span class="m pl"></span>Planejado (ainda não existe)</div>
  </div>`)
}

const ic = n => `<i class="ph-fill ph-${n} ic"></i>`

// ── 2 · Mapa do app ───────────────────────────────────────────
{
  const p = pagina(2, '01 · Visão geral', 'Mapa do aplicativo', 'Por onde o usuário entra e para onde cada aba leva.')
  p.no('ini', 'ini', 48, 124, 120, 44, 'Abrir o app')
  p.no('d1', 'dec', 205, 104, 150, 84, 'Sessão ativa?')
  p.no('login', 'tela', 205, 226, 150, 52, 'Tela de login<small>e-mail e senha</small>')
  p.no('barra', 'tela', 700, 114, 240, 64, 'Barra inferior<small>4 abas + botão “+”</small>')
  p.liga('ini', 'd1'); p.liga('d1', 'barra', { rot: 'Sim' }); p.liga('d1', 'login', { de: 'b', para: 't', rot: 'Não' })
  p.no('nl', 'nota', 372, 238, 230, 30, 'Depois de entrar, o app abre na tela Hoje.')
  const xs = [58, 262, 466, 670, 874]
  const abas = [['hoje', 'tela', 'house', 'Hoje'], ['plano', 'tela', 'calendar-dots', 'Plano'], ['mais', 'acao', 'plus', 'Botão “+”<small style="color:#ffe0dc">registrar treino</small>'], ['prog', 'tela', 'chart-line-up', 'Progresso'], ['perfil', 'tela', 'user-circle', 'Perfil']]
  abas.forEach(([id, tp, ico, nome], i) => { p.no(id, tp, xs[i], 300, 190, 54, `${ic(ico)}${nome}`); p.liga('barra', id, { de: 'b', para: 't' }) })
  const L = (id, i, t, it, h = 250) => { p.lista('l' + id, xs[i], 386, 190, h, t, it, 'l-top'); p.liga(id, 'l' + id, { de: 'b', para: 't' }) }
  L('hoje', 0, 'O dia de treino', ['Check-in e ajuste do dia', 'Sequência semanal e meta', 'Treino de hoje com checklist', 'Iniciar cronômetro de rounds', 'Próxima sessão', 'Sino de alertas'])
  L('plano', 1, 'O plano', ['Plano ativo e progresso', 'Próximo treino em destaque', 'Semanas navegáveis', 'Mudar o dia de uma sessão', 'Escolher ou trocar de plano', 'Encerrar plano'])
  L('mais', 2, 'Registro rápido', ['Tipo do treino', 'Rounds, minutos e RPE', 'Extras do sparring', 'Anotações', 'Resumo do treino salvo'])
  L('prog', 3, 'Evolução', ['Resumo do mês', 'Rounds por semana', 'Carga de treino', 'Treinos por tipo', 'Histórico completo'])
  L('perfil', 4, 'Conta e ferramentas', ['Postura, meta e lembretes', 'Saúde e corpo', 'Biblioteca técnica', 'Perfil de atleta', 'Backup dos dados', 'Sair da conta'])
  p.legenda(682); p.desenhar()
}

// ── 3 · Entrada e perfil ──────────────────────────────────────
{
  const p = pagina(3, '02 · Primeiro acesso', 'Entrada e perfil de atleta', 'Do login até ter um plano ativo e uma meta semanal.')
  p.no('ini', 'ini', 40, 130, 110, 44, 'Abrir o app')
  p.no('d1', 'dec', 178, 110, 150, 84, 'Sessão válida?')
