name: CI

# Roda em todo push, de qualquer branch: a regra da main exige o check `verificar` verde no commit
# antes de aceitar o push, então o CI precisa rodar na branch de trabalho primeiro.
on:
  push:
  pull_request:

# Uma execução por branch: um push novo cancela a anterior que ainda está rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    # Versão fixa: `ubuntu-latest` passa para o Ubuntu 26 em 19/10/2026 e a troca silenciosa pode quebrar o CI.
    # Para migrar, mude aqui, rode o CI numa branch e só então leve para a main.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Navegador de verdade (Chrome, já instalado no runner) contra o build acima.
      - name: Testes de navegador
        run: npx playwright test

      - name: Guarda o relatório quando os testes de navegador falham
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

      # Só dependências de produção: a cadeia do lint (eslint-config-next) tem achados
      # conhecidos que não vão para o app publicado.
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
